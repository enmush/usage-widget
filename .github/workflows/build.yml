name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/UsageWidget.Tests -c Release

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: powershell -File tools/publish.ps1
      - name: Start both packages
        shell: pwsh
        run: |
          Get-ChildItem artifacts/release -Directory | ForEach-Object {
            powershell -File tools/smoke-windows.ps1 (Join-Path $_.FullName 'UsageWidget.exe')
            if ($LASTEXITCODE -ne 0) { throw "Smoke test failed: $($_.Name)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/release/*.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash tools/package-macos.sh arm64
      - run: bash tools/package-macos.sh x64
      - name: Start the arm64 app
        run: |
          mkdir -p artifacts/smoke
          ditto -x -k artifacts/release/UsageWidget-*-macos-arm64.zip artifacts/smoke
          bash tools/smoke-macos.sh "$PWD/artifacts/smoke/Usage Widget.app" artifacts/screen-arm64.png
      - name: Start the x64 app under Rosetta
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
          mkdir -p artifacts/smoke-x64
          ditto -x -k artifacts/release/UsageWidget-*-macos-x64.zip artifacts/smoke-x64
          bash tools/smoke-macos.sh "$PWD/artifacts/smoke-x64/Usage Widget.app" artifacts/screen-x64.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screen
          path: artifacts/screen-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/release/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
          pattern: '{windows,macos}'
      - name: Checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=packaging/release-notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Usage Widget $GITHUB_REF_NAME" \
            $( [ -f "$notes" ] && echo --notes-file "$notes" || echo --generate-notes ) release/*
